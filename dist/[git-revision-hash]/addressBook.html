<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Address Book</title><link rel="icon" href="https://deliveryves.be/wp-content/uploads/2022/03/cropped-cropped-deliveryves-site-icon-1-192x192-1-32x32.png" sizes="32x32"/><link rel="icon" href="https://deliveryves.be/wp-content/uploads/2022/03/cropped-cropped-deliveryves-site-icon-1-192x192-1-192x192.png" sizes="192x192"/><style>@font-face {
        font-family: 'greycliff-medium';
        src: url('./fonts/greycliff-medium.ttf');
      }
      @font-face {
        font-family: 'greycliff-bold';
        src: url('./fonts/greycliff-bold.ttf');

      body,
      #delete_confirm,

        display: none;
      }
      body.active {
        display: block;
      }</style></head><body><header><div class="sec1"><div class="logo"><img src="./assets/logo.png" alt="" srcset=""/></div></div><div class="sec2"><div id="" class="header_btn"><a href="./addressBook.html">Address Book</a></div><div id="" class="header_btn"><a href="./customCrate.html">Custom Crate</a></div><div id="logout" class="header_btn"><a href="javascript:void();">Logout</a></div></div></header><div class="app-container"><div class="left"><div class="title">VENDOR EMAIL</div><div class="email_search"><input type="email" name="search_eamil" id="search_eamil" placeholder="Search Email" autocomplete="off"/></div><div class="emails"></div><div class="new_email"><div class="info">NA</div><div class="field"><input type="email" name="new_email" id="new_email" placeholder="Add Email" autocomplete="off"/></div><div id="newEmailSubmit">SAVE</div></div></div><div class="right"><div class="user_info"><div class="title">USER INFO</div><div class="user_info_content"><div class="field"><div class="label">No. of racks:</div><div class="ctrl"><div id="dec">-</div><div class="val" id="rack_field">0</div><div id="inc">+</div></div></div><div class="field"><div class="label">Show empty crate:</div><div class="ctrl"><input type="checkbox" name="" id="show_crate"/></div></div></div><div id="edit_update_info">EDIT</div></div><div class="adresses"><div class="title">ADDRESS REGISTRATION</div><div class="content"></div><div id="add_address">+ ADD ADDRESS</div></div><div class="address_addition"><div class="title">ADDRESS ADDITION</div><div class="content"><div class="field"><div class="icon"><img src="./assets/location.png" alt="" srcset=""/></div><input name="title" id="title" placeholder="Enter Address Type"/></div><div class="field"><input name="housenumber" id="housenumber" placeholder="House Number"/></div><div class="field"><input name="street" id="street" placeholder="Street"/></div><div class="field"><input name="city" id="city" placeholder="City"/></div><div class="field">
